name: Suggestion
description: Suggest an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This addon is deliberately lightweight: it only colors enemy player names and adds a faction icon.
        Suggestions that fit that goal are the most likely to be added.

  - type: textarea
    id: idea
    attributes:
      label: What would you like?
      description: Describe the change and why it would help.
    validations:
      required: true
